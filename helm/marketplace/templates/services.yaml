apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace.fullname" . }}-backend
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace.fullname" . }}-frontend
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
