{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "marketplace.fullname" . }}
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    # cert-manager fills these Secrets in and renews them automatically.
    - hosts:
        - {{ .Values.ingress.hosts.app }}
      secretName: {{ include "marketplace.fullname" . }}-app-tls
    - hosts:
        - {{ .Values.ingress.hosts.api }}
      secretName: {{ include "marketplace.fullname" . }}-api-tls
  rules:
    - host: {{ .Values.ingress.hosts.app }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "marketplace.fullname" . }}-frontend
                port:
                  name: http
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "marketplace.fullname" . }}-backend
                port:
                  name: http
{{- end }}
