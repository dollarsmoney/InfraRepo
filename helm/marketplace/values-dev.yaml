environment: dev

backend:
  image:
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

frontend:
  image:
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

config:
  NODE_ENV: production
  SUPABASE_URL: https://your-dev-project.supabase.co

ingress:
  # Staging issuer avoids burning the Let's Encrypt production rate limit.
  clusterIssuer: letsencrypt-staging
  hosts:
    app: dev.kmdndd.name.ng
    api: api.dev.kmdndd.name.ng
